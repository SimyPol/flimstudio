[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flim-studio"
version = "0.12.1"
description = "Python interface for time-resolved FLIM microscopy image analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.scripts]
flim-studio-cli = "flim_app.cli:main"

[tool.setuptools]
packages = ["flim_app"]
include-package-data = true

[tool.setuptools.package-data]
flim_app = ["native/**/*", "assets/*"]
